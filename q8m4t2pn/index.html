<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuteng Lin | Portfolio</title>
  <meta name="description" content="Personal portfolio showcasing experience, skills, and selected project highlights." />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Portfolio</p>
        <h1>Yuteng Lin</h1>
        <p id="hero-summary" class="hero-summary"></p>
      </div>
      <div class="hero-card">
        <div class="stat">
          <span class="stat-label">Focus</span>
          <strong>Full Stack Development</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Location</span>
          <strong>Winnipeg, MB</strong>
        </div>
        <div class="stat">
          <span class="stat-label">Strengths</span>
          <strong>Product thinking · Analytics · Cross-stack delivery</strong>
        </div>
      </div>
    </header>

    <main class="content-grid">
      <section class="panel">
        <div class="section-head"><h2>Core Skills</h2></div>
        <div id="skills" class="chip-grid"></div>
      </section>

      <section class="panel">
        <div class="section-head"><h2>Experience</h2></div>
        <div id="experience" class="stack"></div>
      </section>

      <section class="panel">
        <div class="section-head"><h2>Project Highlights</h2></div>
        <div id="highlights" class="cards"></div>
      </section>
    </main>

    <footer class="footer">
      <span>Personal portfolio</span>
      <span>Path: /q8m4t2pn</span>
    </footer>
  </div>
  <script src="./script.js"></script>
</body>
</html>
